name: "Build wheels"

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: wheels-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-wheels:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-24.04
          - name: linux-aarch64
            os: ubuntu-24.04-arm
          - name: macos-arm64
            os: macos-14

    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          # setuptools_scm derives the version from tag distance, so the whole
          # history has to be present or the build fails outright.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build clang lld ccache

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install cmake ninja llvm ccache
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: wheels-ccache-${{ matrix.name }}-${{ github.run_id }}
          restore-keys: |
            wheels-ccache-${{ matrix.name }}-

      - name: Configure ccache
        run: |
          ccache --set-config=max_size=2G
          ccache --zero-stats

      - name: Build MLIR and CIRCT
        uses: ./.github/actions/build-mlir-circt

      - name: Build wheel
        run: |
          pip install build
          python -m build --wheel --outdir dist \
            --config-setting=cmake.define.CMAKE_C_COMPILER_LAUNCHER=ccache \
            --config-setting=cmake.define.CMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Report ccache stats
        run: ccache --show-stats

      - name: Show wheel contents
        run: |
          python -m pip install wheel
          ls -lh dist/
          python -m zipfile --list dist/*.whl | head -40

      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.name }}
          path: dist/*.whl

  publish:
    needs: build-wheels
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          merge-multiple: true
          path: dist

      # A pushed tag does not imply a release exists, so create one first when
      # it does not.
      - name: Attach wheels to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 \
            || gh release create "${GITHUB_REF_NAME}" --verify-tag --generate-notes
          gh release upload "${GITHUB_REF_NAME}" dist/*.whl --clobber
