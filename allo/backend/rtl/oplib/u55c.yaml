# AMD Alveo U55C (xcu55c-fsvh2892-2L-e) operator library -- single precision.
#
# The scheduling model is parameter-driven and device-agnostic: these numbers are
# an example set, and any user can supply their own library (YAML or the Python
# builder) for a non-Xilinx target.
#
# Two kinds of numbers here:
#   * LATENCIES (cycles) -- MEASURED at 300 MHz (Vitis HLS 2023.2, target U55C),
#     read from synthesis-report submodule names that encode op, widths, latency:
#       fadd_32ns_32ns_32_7_full_dsp_1  -> f32 add/sub, latency 7 (DSP-based)
#       fmul_32ns_32ns_32_4_max_dsp_1   -> f32 mul,     latency 4
#       fdiv_32ns_32ns_32_12_no_dsp_1   -> f32 div,     latency 12
#     (add and sub share one core; fadd also has a no_dsp latency-5 variant.)
#   * DELAYS (ns) -- ROUGH ESTIMATES to exercise the chaining model, NOT yet
#     characterized; replace with per-operator values from the timing report.
#
# Scope: single precision only. Double precision, casts, sqrt, float compare
# (its i1 result defeats the classifier), integer multiply/divide, and DSP `unit`
# pools are left coarse pending characterization.
device: xcu55c-fsvh2892-2L-e
frequency_mhz: 300.0
operators:
  # -- single-precision floating point: latencies measured, delays estimated --
  - op: add
    dtype: float
    latency: 7
    delay_ns: 0.5
  - op: sub
    dtype: float
    latency: 7
    delay_ns: 0.5
  - op: mul
    dtype: float
    latency: 4
    delay_ns: 0.5
  - op: div
    dtype: float
    latency: 12
    delay_ns: 0.5
  # -- integer / combinational: rough delay estimates for chaining --
  - op: add
    latency: 0
    delay_ns: 1.0
  - op: sub
    latency: 0
    delay_ns: 1.0
  - op: cmp
    latency: 0
    delay_ns: 1.0
  - op: and
    latency: 0
    delay_ns: 0.4
  - op: or
    latency: 0
    delay_ns: 0.4
  - op: xor
    latency: 0
    delay_ns: 0.4
  - op: shl
    latency: 0
    delay_ns: 0.5
  - op: shr
    latency: 0
    delay_ns: 0.5
  - op: select
    latency: 0
    delay_ns: 0.5
  # -- integer multiply/divide: coarse placeholders (not yet characterized) --
  - op: mul
    latency: 3
  - op: div
    latency: 3
  - op: rem
    latency: 3
  - op: mem_read
    latency: 1
    delay_ns: 0.5
  - op: mem_write
    latency: 1
    delay_ns: 0.5
  - op: stream_read
    latency: 1
  - op: stream_write
    latency: 1
default:
  latency: 0
  delay_ns: 0.0
