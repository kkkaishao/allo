# Built-in default operator library -- used by the RTL backend unless a
# device/library is named. This mirrors the compiled-in C++ default
# (`defaultLibraryYAML()` in mlir/.../OperatorLibrary.cpp); keep the two in sync.
#
# Every abstract operator kind has a timing (latency in cycles, delay in ns for
# chaining) and a realization (`impl`: a native `comb` keyword or an IP module name
# `<f|d|i><op>_l<lat>` the datapath emitter instantiates and the cosim harness
# models).
#
# The single-precision float latencies are measured on AMD U55C at 300 MHz (Vitis
# HLS 2023.2), and double is ~2x. Integer multiply/divide/remainder and all delay
# numbers are rough placeholders -- fill them in from a real report for a specific
# device.
device: builtin
frequency_mhz: 300.0 # 3.333 ns cycle
operators:
  # -- integer / logic ------------------------------------------------------
  # add/sub, bitwise, shift, compare and select are combinational, each with a
  # non-zero gate delay so the chaining model has something to work with;
  # multiply/divide/remainder are multi-cycle IP cores.
  - op: add
    dtype: int
    latency: 0
    delay_ns: 1.2
    impl: comb
  - op: sub
    dtype: int
    latency: 0
    delay_ns: 1.2
    impl: comb
  - op: mul
    dtype: int
    latency: 3
    impl: imul_l3
  - op: div
    dtype: int
    latency: 20
    impl: idiv_l20
  - op: rem
    dtype: int
    latency: 20
    impl: irem_l20
  - op: neg
    dtype: int
    latency: 0
    delay_ns: 1.0
    impl: comb
  - op: cmp
    dtype: int
    latency: 0
    delay_ns: 1.0
    impl: comb
  - op: and
    dtype: int
    latency: 0
    delay_ns: 0.4
    impl: comb
  - op: or
    dtype: int
    latency: 0
    delay_ns: 0.4
    impl: comb
  - op: xor
    dtype: int
    latency: 0
    delay_ns: 0.4
    impl: comb
  - op: shl
    dtype: int
    latency: 0
    delay_ns: 0.5
    impl: comb
  - op: shr
    dtype: int
    latency: 0
    delay_ns: 0.5
    impl: comb
  - op: select
    dtype: int
    latency: 0
    delay_ns: 0.5
    impl: comb
  - op: int_cast # extsi / extui / trunci -- a combinational resize
    dtype: int
    latency: 0
    delay_ns: 0.3
    impl: comb
  # -- single-precision floating point (f32, latencies measured on U55C) -----
  # add/sub/mul/div are pipelined IP; compare is a 1-cycle IP (its i1 result is
  # not a comb float op); select/neg are combinational bit ops.
  - op: add
    dtype: float
    latency: 7
    delay_ns: 0.5
    impl: fadd_l7
  - op: sub
    dtype: float
    latency: 7
    delay_ns: 0.5
    impl: fsub_l7
  - op: mul
    dtype: float
    latency: 4
    delay_ns: 0.5
    impl: fmul_l4
  - op: div
    dtype: float
    latency: 12
    delay_ns: 0.5
    impl: fdiv_l12
  - op: cmp
    dtype: float
    latency: 1
    delay_ns: 0.5
    impl: fcmp_l1
  - op: select
    dtype: float
    latency: 0
    delay_ns: 0.5
    impl: comb
  - op: neg
    dtype: float
    latency: 0
    delay_ns: 0.3
    impl: comb
  # -- double-precision floating point (f64, ~2x single) ---------------------
  - op: add
    dtype: double
    latency: 14
    delay_ns: 0.5
    impl: dadd_l14
  - op: sub
    dtype: double
    latency: 14
    delay_ns: 0.5
    impl: dsub_l14
  - op: mul
    dtype: double
    latency: 9
    delay_ns: 0.5
    impl: dmul_l9
  - op: div
    dtype: double
    latency: 24
    delay_ns: 0.5
    impl: ddiv_l24
  - op: cmp
    dtype: double
    latency: 1
    delay_ns: 0.5
    impl: dcmp_l1
  - op: select
    dtype: double
    latency: 0
    delay_ns: 0.5
    impl: comb
  - op: neg
    dtype: double
    latency: 0
    delay_ns: 0.3
    impl: comb
  # -- bfloat16 (ML reductions: bf16 inputs, f32 accumulate) -----------------
  - op: add
    dtype: bfloat16
    latency: 4
    delay_ns: 0.5
    impl: bfadd_l4
  - op: sub
    dtype: bfloat16
    latency: 4
    delay_ns: 0.5
    impl: bfsub_l4
  - op: mul
    dtype: bfloat16
    latency: 2
    delay_ns: 0.5
    impl: bfmul_l2
  # -- conversions -----------------------------------------------------------
  # int<->float and float-resize are multi-cycle IP; int-resize is combinational
  # (int_cast above). Emitted as unary IP by the datapath emitter.
  - op: int_float_cast # sitofp / fptosi / uitofp / fptoui
    latency: 3
    delay_ns: 0.5
    impl: i2f_l3
  - op: float_cast # extf / truncf (f32<->f64, bf16<->f32)
    latency: 2
    delay_ns: 0.5
    impl: fcvt_l2
default:
  latency: 0
  delay_ns: 0.1
  impl: builtin
# Storage timing. `default:` is the implementation unbound on-chip arrays use
# (Vitis, no AXI: LUTRAM); `primitives:` gives each implementation's read/write
# timing. A complete partition resolves to `register` (combinational read, 1-cycle
# FF write), and `bind_storage impl=...` selects the rest. URAM's slower read needs
# latency 2 to close at 300 MHz.
memory:
  default: lutram
  primitives:
    - name: register
      latency:
        read: 0
        write: 1
      delay_ns:
        read: 0.1
        write: 0.1
    - name: lutram
      latency:
        read: 1
        write: 1
      delay_ns:
        read: 0.5
        write: 0.5
    - name: bram
      latency:
        read: 1
        write: 1
      delay_ns:
        read: 0.7
        write: 0.7
    - name: uram
      latency:
        read: 2
        write: 1
      delay_ns:
        read: 0.9
        write: 0.9
  fifo:
    latency:
      read: 1
      write: 1
    delay_ns:
      read: 0.5
      write: 0.5
