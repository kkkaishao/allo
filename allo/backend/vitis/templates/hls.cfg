# Auto-generated Vitis HLS config for C synthesis driven by `v++ -c --mode hls`
# (the same v++ toolchain that builds the emulation/hardware xclbin).
part={part}

[hls]
clock={clock_period:.4f}ns
flow_target={flow_target}
syn.file=kernel.cpp
syn.top={top}
# Skip the post-synthesis IP/XO packaging (export_design).
package.output.syn=0
