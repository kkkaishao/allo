[build-system]
requires = [
    "nanobind>=2.10",
    "scikit-build-core>=0.10",
]
build-backend = "scikit_build_core.build"

[project]
name = "allo"
version = "0.5"
dependencies = [
    "rich",
    "numpy",
]
requires-python = ">=3.12"
authors = [
    {name = "Allo Authors"}
]
description = "Allo: Accelerator Design and Programming Language"
readme = {file = "README.md", content-type = "text/markdown"}
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["compiler", "hls", "fpga", "accelerator"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
    "Topic :: System :: Hardware",
    "Operating System :: OS Independent"
]

[tool.scikit-build]
minimum-version = "build-system.requires"
cmake.version = ">=3.20"
ninja.version = ">=1.10"
cmake.build-type = "Release"
cmake.source-dir = "mlir"
# Persistent build tree so the generated `allo/_mlir` symlinks always resolve.
build-dir = "build"
wheel.packages = ["allo"]

[tool.scikit-build.cmake.define]
# Build against the same LLVM toolchain the bundled MLIR was built with.
CMAKE_C_COMPILER = "clang"
CMAKE_CXX_COMPILER = "clang++"
MLIR_BINDINGS_PYTHON_NB_DOMAIN = "allo"

[tool.scikit-build.editable]
# Rebuild the native bits on import so `pip install -e .` is one self-healing step.
mode = "redirect"
rebuild = true
verbose = false
